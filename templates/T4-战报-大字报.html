<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>执行一页纸 · T4 战报版 V2（模板示例：M9 上半场经营战报）</title>
<!--
  ═══════════════════════════════════════════════════════════════
  ddmc-onepager · T4 战报版 V2（卡片胶囊风·数据强化）· 用途：数据战报/通报/复盘
  V2 三原则：零分隔线 / 胶囊化 / 默认一屏（≤1700px）。
  数据集中在 const DATA = {...} 一处，只改数据不改版式；
  数字必须从源数据核对后填入，口径注释跟 footer 一起发。
  本文件内容为示例占位（演示槽位用法），生产时整段替换。
  ═══════════════════════════════════════════════════════════════
-->
<style>
  :root{
    --pri:#009999; --pri-dark:#007676; --pri-bg:#DFF2F1;
    --green:#00A500; --green-dark:#008400; --green-bg:#E6F5E6;
    --red:#E34234;   --red-dark:#C23A20; --red-bg:#FBE9E4;
    --orange:#F37021; --orange-deep:#A85400; --orange-bg:#FDF0E3;
    --ink:#32312D;   --mut:#5F6B5F; --mist:#EFF4F2; --card:#FFFFFF;
    --sans:-apple-system,"PingFang SC","MiSans","Microsoft YaHei","Source Han Sans SC",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#E3EAE9;color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;display:flex;justify-content:center;padding:28px 16px}
  .sheet{width:960px;background:var(--mist);padding-bottom:24px}
  .num{font-variant-numeric:tabular-nums lining-nums}

  .band{background:var(--pri);padding:20px 48px 26px}
  .band-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
  .band-top .area{color:#fff;font-size:16px;font-weight:800;letter-spacing:.2em}
  .brandplate{display:flex;align-items:center;background:#fff;border-radius:999px;padding:5px 14px 5px 16px}
  .brandplate .bp-area{font-size:14px;font-weight:800;color:var(--pri-dark);letter-spacing:.08em;
    border-right:1.5px solid rgba(0,118,118,.3);padding-right:12px;margin-right:12px}
  .brandplate img{height:24px;width:auto;display:block}
  .band h1{color:#fff;font-size:42px;font-weight:800;line-height:1.3;text-align:center;letter-spacing:.02em}
  .band h1 b{color:#FFE454}
  .band .sub{display:block;width:max-content;margin:14px auto 0;background:rgba(255,255,255,.16);
    color:#fff;font-size:16px;font-weight:600;padding:7px 20px;border-radius:999px}

  .cards{padding:22px 48px 0;display:flex;flex-direction:column;gap:16px}
  .card{background:var(--card);border-radius:16px;padding:20px 24px;box-shadow:0 2px 12px rgba(15,55,55,.08)}
  .card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .card-head .no{min-width:40px;height:40px;border-radius:12px;background:var(--ink);color:#fff;
    font-size:17px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 8px}
  .card-head .t{font-size:22px;font-weight:800;letter-spacing:.01em}
  .card-head .tag{margin-left:auto;background:#E7EFED;color:var(--mut);
    font-size:13.5px;font-weight:800;padding:5px 14px;border-radius:999px;white-space:nowrap}

  /* KPI 瓦片：绿色面板大数字，无边框 */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .kpi{background:var(--pri-bg);border-radius:14px;padding:16px 16px 14px}
  .kpi.warn{background:var(--orange-bg)}
  .kpi.bad{background:var(--red-bg)}
  .kpi .v{font-size:36px;font-weight:800;letter-spacing:-.02em;line-height:1.1;color:var(--pri-dark)}
  .kpi.warn .v{color:var(--orange)}
  .kpi.bad .v{color:var(--red-dark)}
  .kpi .v small{font-size:19px}
  .kpi .d{font-size:13px;font-weight:800;margin-top:7px;color:var(--green-dark)}
  .kpi.warn .d{color:#C55A00}
  .kpi.bad .d{color:var(--red-dark)}
  .kpi .l{font-size:14px;font-weight:700;margin-top:7px;color:var(--mut)}

  /* 双榜：绿色/红色面板 */
  .ranks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .rk{border-radius:14px;padding:15px 20px}
  .rk.top{background:var(--pri-bg)}
  .rk.btm{background:var(--red-bg)}
  .rk .lab{font-size:15px;font-weight:800;letter-spacing:.08em;margin-bottom:10px}
  .rk.top .lab{color:var(--pri-dark)}
  .rk.btm .lab{color:var(--red-dark)}
  .rk .row{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
  .rk .row .nm{font-size:16.5px;font-weight:700;display:flex;align-items:center;gap:10px}
  .rk .row .no{min-width:28px;height:28px;border-radius:999px;font-size:13.5px;font-weight:800;color:#fff;
    display:flex;align-items:center;justify-content:center;padding:0 6px}
  .rk.top .no{background:var(--pri)}
  .rk.btm .no{background:var(--red)}
  .rk .row .val{font-size:17.5px;font-weight:800}
  .rk .cap{font-size:12.5px;color:var(--mut);margin-top:10px;line-height:1.6;font-weight:600}

  /* 指标条：圆角轨道 + 目标刻度胶囊说明 */
  .bar-row{display:grid;grid-template-columns:240px 1fr 118px;gap:14px;align-items:center;padding:7px 0}
  .bar-row .nm{font-size:15.5px;font-weight:700}
  .bar-row .nm small{display:block;font-size:12px;font-weight:600;color:var(--mut);margin-top:2px}
  .bar{height:20px;background:#E0EAE8;border-radius:999px;position:relative;overflow:visible}
  .bar .fill{height:100%;background:var(--pri);border-radius:999px}
  .bar .fill.warn{background:var(--orange)}
  .bar .fill.bad{background:var(--red)}
  .bar .mark{position:absolute;top:-4px;bottom:-4px;width:3px;border-radius:2px;background:var(--ink)}
  .bar-row .val{font-size:16px;font-weight:800;text-align:right}
  .bar-row .val small{display:block;font-size:11.5px;font-weight:600;color:var(--mut)}

  /* 下阶段：胶囊编号 */
  .next li{list-style:none;display:grid;grid-template-columns:32px 1fr;gap:12px;padding:6px 0;align-items:baseline}
  .next .no{width:28px;height:28px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px;
    font-weight:800;display:flex;align-items:center;justify-content:center;align-self:start}
  .next .do{font-size:16.5px;font-weight:800;line-height:1.5;display:block}
  .next .ow{display:block;font-size:13px;color:var(--mut);font-weight:600;margin-top:2px}

  .foot{text-align:center;padding:18px 48px 6px;font-size:12.5px;color:#6E7A76;font-weight:600;
    display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
  .foot .dot{opacity:.5}

  .export-btn{position:fixed;right:24px;bottom:24px;background:var(--ink);color:#fff;
    border:none;font-size:15px;font-weight:700;padding:12px 22px;cursor:pointer;
    font-family:var(--sans);letter-spacing:.06em}
  .export-btn:disabled{opacity:.6;cursor:wait}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

document.getElementById('mSub').textContent = DATA.meta.sub;
document.getElementById('mTag').textContent = DATA.meta.tag;
document.getElementById('mSource').textContent = DATA.meta.source;

document.getElementById('mKpis').innerHTML = DATA.kpis.map(k=>`
  <div class="kpi num ${k.cls}">
    <div class="v">${k.v}</div>
    <div class="d">${k.d}</div>
    <div class="l">${k.l}</div>
  </div>`).join('');

const rankRow = r=>`
  <div class="row num">
    <span class="nm"><span class="no">${r.rank}</span>${r.name}</span>
    <span class="val">${r.val}</span>
  </div>`;
document.getElementById('mTop').innerHTML = DATA.top.map(rankRow).join('');
document.getElementById('mBtm').innerHTML = DATA.btm.map(rankRow).join('');

document.getElementById('mBars').innerHTML = DATA.bars.map(b=>{
  const pct = Math.min(100, b.val / (b.target * 1.4) * 100);
  const markPct = Math.min(100, b.target / (b.target * 1.4) * 100);
  return `
  <div class="bar-row num">
    <div class="nm">${b.name}<small>${b.sub}</small></div>
    <div class="bar">
      <div class="fill ${b.cls}" style="width:${pct.toFixed(1)}%"></div>
      <div class="mark" style="left:${markPct.toFixed(1)}%"></div>
    </div>
    <div class="val">${b.text}<small>黑线=目标</small></div>
  </div>`;
}).join('');

document.getElementById('mNext').innerHTML = DATA.next.map((n,i)=>`
  <li>
    <span class="no">${i+1}</span>
    <span><span class="do">${n.do}</span><span class="ow">${n.ow}</span></span>
  </li>`).join('');

async function exportPNG(){
  const btn=document.getElementById('exportBtn');
  btn.disabled=true;btn.textContent='正在生成…';
  try{
    const canvas=await html2canvas(document.getElementById('sheet'),{scale:2,useCORS:true,backgroundColor:'#EFF4F2'});
    const link=document.createElement('a');
    link.download='一页纸_战报.png';
    link.href=canvas.toDataURL('image/png');
    link.click();
  }catch(e){alert('导出失败：请联网后重试');}
  btn.textContent='保存为图片';btn.disabled=false;
}
